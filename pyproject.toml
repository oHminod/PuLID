[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pulid-app"
version = "0.1.0"
description = "Pipeline Python autonome pour PuLID et SDXL"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "insightface==0.7.3",
  "numpy>=1.26,<3",
  "onnxruntime>=1.20,<2",
  "opencv-python>=4.10,<5",
  "Pillow>=11,<13",
  "PyYAML>=6.0.2,<7",
  "rich>=13.9,<15",
  # InsightFace 0.7.3 appelle encore SimilarityTransform.estimate().
  "scikit-image>=0.22,<0.26",
  "torch>=2.13,<2.14",
]

[project.optional-dependencies]
# Dépendances complémentaires installées lorsque les phases d'inférence commencent.
inference = [
  "accelerate>=1.14,<1.15",
  "diffusers>=0.39,<0.40",
  "huggingface-hub>=1.27,<1.28",
  "safetensors>=0.8,<0.9",
  "torchvision>=0.28,<0.29",
  "transformers>=5.15,<5.16",
]
pulid = [
  "einops>=0.8,<0.9",
  "facexlib>=0.3,<0.4",
  "ftfy>=6.3,<7",
  "timm>=1.0,<2",
]
dev = [
  "pytest>=8.3,<10",
]

[project.scripts]
pulid-inspect-models = "pulid_app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pulid_app"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
